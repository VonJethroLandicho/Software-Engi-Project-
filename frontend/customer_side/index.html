<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mugshot Barbershop - Live Queue</title>
    <link rel="stylesheet" href="/customer_side/css/theme.css">
    <link rel="stylesheet" href="/customer_side/css/layout.css">
</head>
<body>
    <script>
      (async () => {
        const token = localStorage.getItem("id_token");
        if (!token) { window.location.href = '/'; return; }
        try {
          const res = await fetch("http://127.0.0.1:5000/auth/me", {
            headers: { "Authorization": `Bearer ${token}` }
          });
          if (!res.ok) throw new Error("Session invalid");
          const user = await res.json();
          document.addEventListener("DOMContentLoaded", () => {
            const emailEl = document.getElementById("customer-email");
            if (emailEl) emailEl.textContent = user.email;
          });
        } catch {
          localStorage.removeItem("id_token");
          window.location.href = '/';
        }
      })();

      async function logout() {
        const token = localStorage.getItem("id_token");
        if (token) {
          await fetch("http://127.0.0.1:5000/auth/logout", {
            method: "POST", headers: { "Authorization": `Bearer ${token}` }
          }).catch(() => {});
        }
        localStorage.removeItem("id_token");
        window.location.href = '/';
      }
    </script>

    <header class="top-bar" style="position: relative;">
        <h1>MUGSHOT <span class="ph">PH</span></h1>
        <p>Live Shop Status & Appointments — <span id="customer-email"></span></p>
        <button onclick="logout()" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: transparent; color: white; border: 2px solid white; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s;">
          Logout
        </button>
    </header>

    <main class="dashboard-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <h2 style="color: var(--red); margin: 0;">Live Barbershop Floor</h2>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="btn btn-outline" style="color: var(--black); border-color: var(--black); font-weight: bold; width: auto; padding: 10px 20px;" onclick="window.viewServicesMenu()">☰ View Services Menu</button>
                <button class="btn btn-red" style="width: auto; padding: 10px 20px;" onclick="openBooking()">Book an Appointment</button>
            </div>
        </div>

        <section class="seat-grid" id="seat-grid">
            </section>

        <section id="appointments-dashboard" style="margin-top: 50px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <h2 style="color: var(--text-dark); margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px;">Appointment Requests View</h2>
            <div id="appointment-list">
                </div>
        </section>

        <div id="booking-modal" class="modal-hidden">
            <div class="modal-content">
                <button id="close-modal" class="btn btn-outline" style="float: right; width: auto; padding: 5px 10px;">✕</button>
                <div id="modal-body"></div>
            </div>
        </div>
    </main>

    <script src="/customer_side/js/main.js"></script>
    <script>
        // Create a super long chain of history states to prevent back navigation
        window.history.pushState(null, null, window.location.href);
        for (let i = 0; i < 1000; i++) {
            window.history.pushState(null, null, window.location.href);
        }
        window.addEventListener('popstate', function() {
            window.history.pushState(null, null, window.location.href);
        });
    </script>
</body>
</html>
