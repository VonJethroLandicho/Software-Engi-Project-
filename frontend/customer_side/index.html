<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mugshot Barbershop - Live Queue</title>
    <link rel="stylesheet" href="/customer_side/css/theme.css">
    <link rel="stylesheet" href="/customer_side/css/layout.css">
</head>
<body>
    <header class="top-bar">
        <h1>MUGSHOT <span class="ph">PH</span></h1>
        <p>Live Shop Status & Appointments</p>
    </header>

    <main class="dashboard-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: var(--red);">Live Barbershop Floor</h2>
            <button class="btn btn-red" style="width: auto; padding: 10px 20px;" onclick="openBooking()">Book an Appointment</button>
        </div>

        <section class="seat-grid" id="seat-grid">
            </section>

        <section id="appointments-dashboard" style="margin-top: 50px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <h2 style="color: var(--text-dark); margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px;">Appointment Requests View</h2>
            <div id="appointment-list">
                </div>
        </section>

        <div id="booking-modal" class="modal-hidden">
            <div class="modal-content">
                <button id="close-modal" class="btn btn-outline" style="float: right; width: auto; padding: 5px 10px;">✕</button>
                <div id="modal-body"></div>
            </div>
        </div>
    </main>

    <script src="/customer_side/js/main.js"></script>
</body>
</html>
