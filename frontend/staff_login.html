<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mugshot PH — Staff Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;600&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page-wrapper">

    <!-- Left branding panel -->
    <div class="brand-panel">
      <div class="pole-accent"></div>
      <div class="logo-area">
        <div class="logo-img-wrap">
          <img src="img/mugshot_logo.png" alt="Mugshot PH" />
        </div>
        <div class="divider-stars"><span>★ ★ ★</span></div>
        <p class="brand-tagline">Staff access only.<br>Manage the floor.<br>Keep the shop sharp.</p>
      </div>
      <div class="brand-footer">
        <ul class="services-list">
          <li>Queue Management</li>
          <li>Appointments</li>
          <li>Barber Dashboard</li>
          <li>Shop Analytics</li>
        </ul>
      </div>
    </div>

    <!-- Right form panel -->
    <div class="form-panel">
      <div class="form-header">
        <div class="form-eyebrow">Staff Portal</div>
        <div class="form-title">Welcome Back</div>
        <p class="form-subtitle">Not staff? <a href="/welcome">Go back to portal select</a></p>
      </div>

      <div class="field-group">
        <label class="field-label">Email Address</label>
        <div class="field-input-wrap">
          <input class="field-input" type="email" id="emailInput" placeholder="staff@mugshotph.com" />
          <span class="field-icon">✉</span>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="field-input-wrap">
          <input class="field-input" type="password" placeholder="••••••••" id="pwdInput" />
          <span class="field-icon" onclick="togglePwd()">👁</span>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-label" onclick="toggleCheck()">
          <div class="custom-checkbox checked" id="checkbox"></div>
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      <button class="btn-signin" onclick="handleSignIn()">Sign In</button>

    </div>

  </div>

  <script>
    async function handleSignIn() {
      const email    = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('pwdInput').value;
      const btn      = document.querySelector('.btn-signin');

      if (!email || !password) { alert("Please enter both email and password."); return; }

      btn.textContent   = 'Signing In...';
      btn.disabled      = true;
      btn.style.opacity = '0.7';

      try {
        const response = await fetch('/auth/staff-login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password })
        });
        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('id_token', data.id_token);
          btn.textContent      = '✓ Access Granted';
          btn.style.background = '#1a6b3a';
          setTimeout(() => { window.location.href = '/admin'; }, 1000);
        } else {
          alert(data.detail || 'Access Denied');
          resetButton(btn);
        }
      } catch (err) {
        alert('Could not connect to the server. Is Flask running?');
        resetButton(btn);
      }
    }

    function resetButton(btn) {
      btn.textContent      = 'Sign In';
      btn.disabled         = false;
      btn.style.opacity    = '1';
      btn.style.background = '';
    }

    function togglePwd() {
      const pwd = document.getElementById('pwdInput');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    function toggleCheck() {
      document.getElementById('checkbox').classList.toggle('checked');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSignIn();
    });
  </script>

</body>
</html>
