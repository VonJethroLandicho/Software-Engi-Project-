<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mugshot PH — Barbershop</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;600&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/welcome.css">
</head>
<body>

  <div class="container">

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="/img/mugshot_logo.png" alt="Mugshot PH Barbershop" />
    </div>

    <!-- Tagline -->
    <div class="tagline-row">
      <span class="tagline">Premium cuts. Classic style.</span>
    </div>
    <p class="portal-label">Select your portal to continue</p>

    <!-- Portal Cards -->
    <div class="cards">

      <a class="card" href="/customer-login">
        <div class="card-title">Customer</div>
        <p class="card-desc">Book appointments &amp; check your queue status.</p>
        <span class="card-btn">Enter</span>
      </a>

      <div class="card-divider"></div>

      <a class="card" href="/staff-login">
        <div class="card-title">Staff</div>
        <p class="card-desc">Manage the shop, queues &amp; appointments.</p>
        <span class="card-btn">Sign In</span>
      </a>

    </div>

    <!-- Footer Services -->
    <ul class="footer-services">
      <li>Haircut &amp; Styling</li>
      <li>Hot Towel Shave</li>
      <li>Beard Grooming</li>
      <li>Kids Cut</li>
    </ul>

  </div>

</body>
</html>
