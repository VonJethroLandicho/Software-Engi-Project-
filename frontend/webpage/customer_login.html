<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mugshot PH — Customer Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;600&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    window.__FIREBASE_CONFIG__ = {
      apiKey:            "AIzaSyAuk5EDcS0jtZidiWW-am8ba0QGEHyomU8",
      authDomain:        "software-eng-15208.firebaseapp.com",
      projectId:         "software-eng-15208",
      storageBucket:     "software-eng-15208.firebasestorage.app",
      messagingSenderId: "429926523792",
      appId:             "1:429926523792:web:e6409e24cf619950c40915"
    };
  </script>
</head>
<body>

  <div class="page-wrapper">

    <div class="brand-panel">
      <div class="pole-accent"></div>
      <div class="logo-area">
        <div class="logo-img-wrap">
          <img src="img/mugshot_logo.png" alt="Mugshot PH" />
        </div>
        <div class="divider-stars"><span>★ ★ ★</span></div>
        <p class="brand-tagline">Book your seat.<br>Skip the wait.<br>Your fresh cut awaits.</p>
      </div>
      <div class="brand-footer">
        <ul class="services-list">
          <li>Haircut & Styling</li>
          <li>Hot Towel Shave</li>
          <li>Beard Grooming</li>
          <li>Kids Cut</li>
        </ul>
      </div>
    </div>

    <div class="form-panel">
      <div class="form-header">
        <div class="form-eyebrow">Customer Portal</div>
        <div class="form-title">Welcome In</div>
        <p class="form-subtitle">New here? <a href="/customer-register">Create an account</a></p>
      </div>

      <div class="field-group">
        <label class="field-label">Email Address</label>
        <div class="field-input-wrap">
          <input class="field-input" type="email" id="emailInput" placeholder="you@email.com" />
          <span class="field-icon">✉</span>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="field-input-wrap">
          <input class="field-input" type="password" placeholder="••••••••" id="pwdInput" />
          <span class="field-icon pwd-toggle" id="pwdToggle" onclick="togglePwd()" title="Show password">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 12a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/></svg>
          </span>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-label" onclick="toggleCheck()">
          <div class="custom-checkbox checked" id="checkbox"></div>
          Remember me
        </label>
        <a href="#" class="forgot-link" onclick="handleForgotPassword()">Forgot Password?</a>
      </div>

      <div id="loginFeedback" class="login-feedback" aria-live="polite"></div>

      <button class="btn-signin" id="signinBtn" onclick="handleSignIn()">Sign In</button>

      <div class="or-divider"><span>Or continue with</span></div>

      <button class="btn-google" id="googleBtn" onclick="window.handleGoogleSignIn()">
        <span class="google-g">G</span>
        Continue with Google
      </button>

      <a href="/welcome" class="back-link">← Back to Portal Select</a>
    </div>

  </div>

  <script type="module">
    import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const app      = initializeApp(window.__FIREBASE_CONFIG__);
    const auth     = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Exposed to window so the onclick attribute can reach it
    window.handleGoogleSignIn = async function () {
      const btn = document.getElementById('googleBtn');
      btn.disabled      = true;
      btn.style.opacity = '0.6';
      btn.innerHTML     = '<span class="google-g">G</span> Signing in...';

      try {
        const result  = await signInWithPopup(auth, provider);
        const idToken = await result.user.getIdToken();
        
        localStorage.setItem('id_token', idToken);
        localStorage.setItem('uid', result.user.uid); // Saves UID to trigger autofill
        
        btn.innerHTML = '<span class="google-g">G</span> ✓ Success';
        btn.style.background = '#1a6b3a';
        setTimeout(() => { window.location.href = '/customer'; }, 800);
      } catch (err) {
        console.error('Google Sign-In error:', err.code, err.message);
        if (err.code === 'auth/popup-blocked') {
          showFeedback('Google popup was blocked. Please allow popups for this site and try again.', 'error');
        } else if (err.code !== 'auth/popup-closed-by-user') {
          showFeedback('Google Sign-In failed: ' + err.message, 'error');
        }
        btn.disabled      = false;
        btn.style.opacity = '1';
        btn.style.background = '';
        btn.innerHTML     = '<span class="google-g">G</span> Continue with Google';
      }
    };

    window.handleSignIn = async function () {
      const email    = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('pwdInput').value;
      const btn      = document.getElementById('signinBtn');

      if (!email || !password) { showFeedback('Please enter both your email and password to continue.', 'error'); return; }

      btn.textContent   = 'Signing In...';
      btn.disabled      = true;
      btn.style.opacity = '0.7';

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const idToken = await userCredential.user.getIdToken();
        
        localStorage.setItem('id_token', idToken);
        localStorage.setItem('uid', userCredential.user.uid); // Saves UID to trigger autofill

        btn.textContent      = '✓ Success';
        btn.style.background = '#1a6b3a';
        setTimeout(() => { window.location.href = '/customer'; }, 900);
      } catch (err) {
        const msg = err.code === 'auth/invalid-credential' ? 'The email or password is incorrect. Please try again.' : err.message;
        showFeedback('Login failed: ' + msg, 'error');
        btn.textContent      = 'Sign In';
        btn.disabled         = false;
        btn.style.opacity    = '1';
        btn.style.background = '';
      }
    };

    window.handleForgotPassword = async function () {
      const email = document.getElementById('emailInput').value.trim();
      if (!email) { showFeedback('Enter your email so we can send the reset link.', 'error'); return; }

      try {
        await sendPasswordResetEmail(auth, email);
        showFeedback('Password reset email sent! Check your inbox for instructions.', 'success');
      } catch (err) {
        showFeedback('Could not send reset email: ' + err.message, 'error');
      }
    };

    window.showFeedback = function (message, type = 'error') {
      const feedback = document.getElementById('loginFeedback');
      if (!feedback) {
        window.alert(message);
        return;
      }
      feedback.textContent = message;
      feedback.className = 'login-feedback ' + type;
      feedback.style.opacity = '1';
      feedback.style.transform = 'translateY(0)';
      clearTimeout(window.__feedbackTimeout);
      window.__feedbackTimeout = setTimeout(() => {
        feedback.style.opacity = '0';
        feedback.style.transform = 'translateY(-10px)';
      }, 6500);
    };
  </script>

  <script>
    function togglePwd() {
      const el = document.getElementById('pwdInput');
      const icon = document.getElementById('pwdToggle');
      el.type = el.type === 'password' ? 'text' : 'password';
      if (icon) {
        if (el.type === 'password') {
          icon.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 12a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/></svg>';
          icon.title = 'Show password';
        } else {
          icon.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.6 2.6L1.3 3.9l3.3 3.3C3.4 8.6 2.6 10.3 2.2 12c1.8 3.3 5.5 6 10 6 1.4 0 2.8-0.3 4-0.8l3.6 3.6 1.3-1.3L2.6 2.6zM12 17c-2.8 0-5-2.2-5-5 0-0.9 0.2-1.7 0.6-2.4l1.4 1.4C9.3 11 9 11.9 9 13c0 1.7 1.3 3 3 3 1.1 0 2-0.3 2.7-0.8l1.5 1.5C15.6 16.8 13.9 17 12 17zm6.7-2.8l-1.7-1.7c0.5-0.6 0.8-1.3 0.8-2.2 0-2.8-2.2-5-5-5-0.9 0-1.7 0.2-2.4 0.6L6.9 4.3C8.1 3.8 9.5 3.5 11 3.5c4.5 0 8.2 2.7 10 6-0.4 0.8-1.1 1.5-1.8 2.1z"/></svg>';
          icon.title = 'Hide password';
        }
      }
    }
    function toggleCheck() {
      document.getElementById('checkbox').classList.toggle('checked');
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
          if (window.handleSignIn) window.handleSignIn();
      }
    });
  </script>

</body>
</html>
